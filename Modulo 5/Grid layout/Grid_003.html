<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando o grid template</title>
    <style>
        body{
            background-color: rgb(34, 75, 7);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        div.container{
            border: 2px solid yellow;
            border-radius: 10px;
            height: 400px;
            padding: 9px;

            display: grid;
            grid-template:100px 100px 100px / auto auto auto;
            align-content: center;
            gap: 10px; 

            /* grid-auto-rows: 100px;    Aumenta as linhas que não foram definidas */
        }
        div.item{
            border: 2px solid white;
            border-radius: 10px;
            text-align: center ;
            background-color: rgba(103, 151, 193, 0.608);

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Escola</div>
        <div class="item">Igreja</div>
        <div class="item">Hospital</div>
        <div class="item">Casa</div>
        <div class="item">Trabalho</div>
        <div class="item">Quarto</div>
        <div class="item">Jantar</div>
        <div class="item">Sala</div>
        <div class="item">Cozinha</div>

    </div>
    
</body>
</html>
