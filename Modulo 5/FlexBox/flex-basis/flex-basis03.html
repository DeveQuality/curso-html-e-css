<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container{
            background-color: rgba(188, 10, 10, 0.72);
            padding: 10px;

            display: flex;
            flex-flow:row nowrap;

        }
        div.item{
            background-color: rgb(255, 255, 255);
            border: 5px solid rgb(81, 3, 3);
            border-radius: 20%;
            text-align: center;
            font-family: cursive;
            padding: 10px;
            margin: 5px;
        }

        div#primeiro{
            /* flex-shrink:1 ;
            flex-grow: 2;
            flex-basis:200px; */

            flex: 2 1 200px;
        }

        div#segundo{
            /* flex-shrink: 0;
            flex-grow: 1;
            flex-basis:200px; */

            flex:1 0 200px;
        }

        div#terceiro{
            /* flex-shrink:2 ;
            flex-grow: 0;
            flex-basis:200px; */

            flex: 0 2 200px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="primeiro">B</div>
        <div class="item" id="segundo">A</div>
        <div class="item" id="terceiro">S</div>
    </div>
</body>
</html>
