<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container{
            background-color: lightsalmon;
            padding: 10px;

            display: flex;
            flex-flow:row nowrap;

        }
        div.item{
            background-color: rgb(255, 255, 255);
            border: 5px solid rgb(81, 3, 3);
            border-radius: 10px;
            text-align: center;
            font-family: cursive;
            padding: 10px;
            margin: 5px;


            flex-basis:auto ;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Eu Amo Viver</div>
        <div class="item">C</div>
        <div class="item"> E aquela Paixao</div>
        <div class="item"> Adoro aquele Sorriso</div>
        <div class="item">O</div>
        <div class="item">Tenho muita Raiva</div>
        <div class="item">D</div>
    </div>
</body>
</html>
