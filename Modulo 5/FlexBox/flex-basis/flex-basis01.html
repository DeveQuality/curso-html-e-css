<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container{
            background-color: rgb(10, 188, 43);
            padding: 10px;

            display: flex;
            flex-flow:row nowrap;

        }
        div.item{
            background-color: rgb(255, 255, 255);
            border: 5px solid rgb(81, 3, 3);
            border-radius: 10px;
            text-align: center;
            font-family: cursive;
            padding: 10px;
            margin: 5px;


            flex-basis:250px;

            flex-shrink: 1;             /*  permite que o conteudo diminua ou nao com os valores 0 e 1 */
            flex-grow: 1;               /*  permite que o conteudo cresca ou nao com os valores 0 e 1 */ 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">B</div>
        <div class="item">A</div>
        <div class="item">S</div>
    </div>
</body>
</html>
