
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        body{
            background-color: rgb(99, 97, 97);
        }
        div.container{
            background-color: rgb(29, 175, 219);
            border: 2px solid rgb(255, 255, 255);
            border-radius: 10px;

            display: flex;
            flex-flow: row  nowrap;

            /* justify-content: space-around;           ele alinha os itens com espaçamento igual nas extremidades */
            /* justify-content: space-evenly;          ele alinha os itens com espaçamento igual*/ 
            /* justify-content: center;                 ele alinha no centro */
            /* justify-content: flex-end;               ele alinha a esquerda */

            align-items: stretch; 
        }
        
        div.item{
            background-color: rgb(255, 255, 255);
            border: 5px solid rgb(35, 10, 117);
            border-radius: 10px;
            text-align: center;
            font-family: cursive;
            padding: 10px;

        }
         div.item:hover{
            background-color: blue;
            color: white;
            transition: 1s;
            cursor: pointer;
         }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Eu Tenho Amor</div>
        <div class="item">Eu Tenho Carinho</div>
        <div class="item">Eu Tenho Paixao</div>
        <div class="item">Eu Tenho Raiva</div>
        <div class="item">Eu Tenho Duvida</div>
    </div>
</body>
</html>
