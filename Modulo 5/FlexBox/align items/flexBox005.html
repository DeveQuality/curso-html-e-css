
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entendendo o align-items</title>
    <style>
        body{
            background-color: rgb(99, 97, 97);
        }
        div.container{
            background-color: rgb(29, 175, 219);
            border: 2px solid rgb(255, 255, 255);
            border-radius: 10px;
            height: 30vh;

            display: flex;
            flex-flow: row nowrap;
            justify-content: space-around;

            /* align-items:stretch;                 definicao padrao */  
            /* align-items:flex-start;              os intems estarao em cima */
            /* align-items:flex-end;                os intems estarao em baixo */
            align-items:center;                 /* os itens estarao no centro */

        }
        
        div.item{
            background-color: rgb(255, 255, 255);
            border: 5px solid rgb(10, 114, 78);
            border-radius: 10px;
            text-align: center;
            font-family: cursive;
            padding: 10px;

        }
         div.item:hover{
            background-color: rgb(109, 225, 70);
            color: white;
            transition: 1s;
            cursor: pointer;
         }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Eu Tenho Amor</div>
        <div class="item">Eu Tenho Carinho</div>
        <div class="item">Eu Tenho Paixao</div>
        <div class="item">Eu Tenho Raiva</div>
        <div class="item">Eu Tenho Duvida</div>
    </div>
</body>
</html>
