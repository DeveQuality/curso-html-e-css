<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container{
            background-color: lightsalmon;
            padding: 10px;

            height: 300px;
            display: flex;          /* faz as divs estarem em fila */
            flex-flow:row wrap;   /* permite que as divs filhos quebrem a linha quando nao houver mais espaco na tela */
        }
        div.item{
            background-color: rgb(255, 255, 255);
            border: 5px solid rgb(81, 3, 3);
            border-radius: 10px;
            text-align: center;
            font-family: cursive;
            padding: 10px;
            margin: 5px;

        }
        div#i1{
            align-self: center;
        }
        div#i2{
            align-self: flex-end;
        }
        div#i3{
            align-self: stretch;
        }
        div#i4{
            align-self: center;  
        }
        div#i5{
            align-self: start;
        }
        div#i6{
            align-self: flex-end;
        }
        div#i7{
            align-self: flex-start;
        }
        div#i8{
            align-self: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item" id="i1">Bonito</div>
        <div class="item" id="i2">Dramatico</div>
        <div class="item" id="i3">Radiante</div>
        <div class="item" id="i4">Alto</div>
        <div class="item" id="i5">Nojento</div>
        <div class="item" id="i6">Rico</div>
        <div class="item" id="i7">Espetacular</div>
        <div class="item" id="i8">Brilhante</div>
    </div>
</body>
</html>
